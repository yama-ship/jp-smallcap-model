name: select-handcalc

# 手計算の銘柄を選ぶ(較正計画 v0.5 第2-1節)。main で1回だけ手動実行する。
# calib-fetch が main で作ったキャッシュを読む。ログに出すのは、件数・銘柄コード・手計算の期間だけ。
# 選び直しはしない。バグ修正で再実行するときは、その理由を実行記録に残す(CHARTER 第7章)。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "選定を実行するなら select と入力する"
        required: true

permissions:
  contents: read

concurrency:
  group: select-handcalc
  cancel-in-progress: false

jobs:
  select:
    if: github.event.inputs.confirm == 'select' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/calendar/2017-02-01_2017-12-31
          key: calib-v1-calendar-2017-02-01-2017-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/calendar/2018-01-01_2018-12-31
          key: calib-v1-calendar-2018-01-01-2018-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/calendar/2019-01-01_2019-12-31
          key: calib-v1-calendar-2019-01-01-2019-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/calendar/2020-01-01_2020-06-30
          key: calib-v1-calendar-2020-01-01-2020-06-30
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/master/2017-02-01_2017-12-31
          key: calib-v1-master-2017-02-01-2017-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/master/2018-01-01_2018-12-31
          key: calib-v1-master-2018-01-01-2018-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/master/2019-01-01_2019-12-31
          key: calib-v1-master-2019-01-01-2019-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/master/2020-01-01_2020-06-30
          key: calib-v1-master-2020-01-01-2020-06-30
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/bars/2017-02-01_2017-12-31
          key: calib-v1-bars-2017-02-01-2017-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/bars/2018-01-01_2018-12-31
          key: calib-v1-bars-2018-01-01-2018-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/bars/2019-01-01_2019-12-31
          key: calib-v1-bars-2019-01-01-2019-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/bars/2020-01-01_2020-06-30
          key: calib-v1-bars-2020-01-01-2020-06-30
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/fins/2017-02-01_2017-12-31
          key: calib-v1-fins-2017-02-01-2017-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/fins/2018-01-01_2018-12-31
          key: calib-v1-fins-2018-01-01-2018-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/fins/2019-01-01_2019-12-31
          key: calib-v1-fins-2019-01-01-2019-12-31
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: data/fins/2020-01-01_2020-06-30
          key: calib-v1-fins-2020-01-01-2020-06-30
          fail-on-cache-miss: true
      - run: python3 tools/calib/select_handcalc.py data
